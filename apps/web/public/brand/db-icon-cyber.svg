<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1C"/>
      <stop offset="50%" stop-color="#05060D"/>
      <stop offset="100%" stop-color="#03040A"/>
    </linearGradient>
    <linearGradient id="cyber-spire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E0FF"/>
      <stop offset="100%" stop-color="#0A5F75"/>
    </linearGradient>
    <linearGradient id="cyber-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E0FF"/>
      <stop offset="55%" stop-color="#8A4CFF"/>
      <stop offset="100%" stop-color="#FF2ED4"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="168" height="168" rx="30" fill="url(#cyber-bg)" stroke="#1D2544" stroke-width="2"/>
  <path d="M10 118 L170 118" stroke="#00E0FF" stroke-width="1" stroke-dasharray="5 8" opacity="0.35"/>
  <path d="M34 30 L34 150" stroke="#FF2ED4" stroke-width="1" stroke-dasharray="2 6" opacity="0.4"/>

  <g transform="translate(90, 94)">
    <path d="M-20 52 L-8 -26 C-8 -31 -4 -35 4 -35 C12 -35 16 -31 16 -26 L28 52 Z" fill="url(#cyber-spire)" stroke="#00E0FF" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="4" y1="-30" x2="4" y2="52" stroke="#EAF6FF" stroke-width="2.2" filter="url(#bloom)"/>
    <circle cx="4" cy="-33" r="4.5" fill="#19FF8C" filter="url(#bloom)"/>
    <circle cx="4" cy="-33" r="9" stroke="#19FF8C" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.9"/>
    <circle cx="4" cy="-33" r="15" stroke="#00E0FF" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6"/>
    <rect x="-32" y="48" width="72" height="6" rx="3" fill="#0B1024" stroke="#00E0FF" stroke-width="1.4"/>
    <path d="M-42 42 C-20 28 48 26 56 40 C60 47 50 44 44 44 C26 40 -18 42 -38 48 C-46 51 -46 46 -42 42 Z" fill="#0A0E1C" stroke="url(#cyber-neon)" stroke-width="1.6" opacity="0.85"/>
  </g>

  <rect x="48" y="8" width="2.5" height="18" fill="#FF2ED4" opacity="0.7"/>
  <rect x="127" y="146" width="2.5" height="20" fill="#00E0FF" opacity="0.7"/>
  <circle cx="60" cy="150" r="2.5" fill="#8A4CFF" filter="url(#bloom)"/>
  <circle cx="136" cy="26" r="2.5" fill="#00E0FF" filter="url(#bloom)"/>
</svg>