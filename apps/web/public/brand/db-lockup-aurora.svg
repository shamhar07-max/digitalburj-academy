<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" width="680" height="150" fill="none">
  <defs>
    <linearGradient id="aurora-word" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2FF2A0"/>
      <stop offset="30%" stop-color="#2EE6FF"/>
      <stop offset="60%" stop-color="#A78BFF"/>
      <stop offset="85%" stop-color="#FF6BD6"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="aurora-spire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="45%" stop-color="#FF6BD6"/>
      <stop offset="100%" stop-color="#A78BFF"/>
    </linearGradient>
    <linearGradient id="aurora-slab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2FF2A0"/>
      <stop offset="100%" stop-color="#2EE6FF"/>
    </linearGradient>
    <radialGradient id="aurora-glow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#A78BFF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FF6BD6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0A0616" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="680" height="150" fill="url(#aurora-glow)"/>

  <g opacity="0.5">
    <line x1="30" y1="120" x2="650" y2="120" stroke="#A78BFF" stroke-width="0.8" stroke-dasharray="4 7"/>
  </g>

  <g transform="translate(30, 26)">
    <!-- burj spire -->
    <path d="M18 92 L26 10 C26 7 29 5 34 5 C39 5 42 7 42 10 L50 92 Z" fill="url(#aurora-spire)" stroke="#FFD166" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>
    <line x1="34" y1="8" x2="34" y2="92" stroke="#F3ECFF" stroke-width="1.6" filter="url(#bloom)"/>
    <circle cx="34" cy="10" r="3.2" fill="#FFD166" filter="url(#bloom)"/>
    <circle cx="34" cy="10" r="6.5" stroke="#FFD166" stroke-width="1" stroke-dasharray="2 3" opacity="0.9"/>
    <circle cx="34" cy="10" r="11" stroke="#FF6BD6" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.7"/>
    <!-- curtain ribbon behind spire -->
    <path d="M4 92 C24 58 46 58 64 92 Z" fill="#2EE6FF" opacity="0.16" filter="url(#bloom)"/>
    <!-- floor slab -->
    <rect x="10" y="90" width="48" height="4.5" rx="2" fill="#191242" stroke="url(#aurora-slab)" stroke-width="1" opacity="0.95"/>
    <path d="M14 82 L22 78 L22 90 L14 90 Z" fill="#241C4C"/>
    <line x1="18" y1="79" x2="18" y2="90" stroke="#2FF2A0" stroke-width="1" opacity="0.85"/>
    <path d="M24 64 L31 60 L31 90 L24 90 Z" fill="#241C4C"/>
    <line x1="27.5" y1="62" x2="27.5" y2="90" stroke="#2EE6FF" stroke-width="1.2" opacity="0.9"/>
    <!-- signal fan -->
    <line x1="34" y1="20" x2="74" y2="38" stroke="#2FF2A0" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.8"/>
    <circle cx="74" cy="38" r="2.4" fill="#2FF2A0" filter="url(#bloom)"/>
    <line x1="34" y1="38" x2="-6" y2="54" stroke="#FF6BD6" stroke-width="1.3" stroke-dasharray="3 4" opacity="0.8"/>
    <circle cx="-6" cy="54" r="2.2" fill="#FF6BD6" filter="url(#bloom)"/>
    <line x1="34" y1="54" x2="80" y2="70" stroke="#2EE6FF" stroke-width="1.1" stroke-dasharray="2 3" opacity="0.7"/>
    <circle cx="80" cy="70" r="2" fill="#2EE6FF"/>
    <!-- base path -->
    <path d="M-8 77 C16 62 76 58 90 76 C96 84 88 78 82 78 C66 74 30 76 8 84 C-2 88 -10 84 -8 77 Z" fill="#150E33" stroke="url(#aurora-word)" stroke-width="1.4" opacity="0.95"/>
  </g>

  <g transform="translate(122, 50)">
    <text x="0" y="0" font-family="'Playfair Display','Georgia',serif" font-weight="700" font-size="34" letter-spacing="2" fill="url(#aurora-word)">DIGITAL</text>
    <text x="188" y="0" font-family="'Playfair Display','Georgia',serif" font-weight="700" font-size="34" letter-spacing="2" fill="#F3ECFF">BURJ</text>
    <text x="380" y="0" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600" letter-spacing="3" fill="#FFD166" filter="url(#bloom)">EST. 2024 · AE</text>
    <g transform="translate(0, 15)">
      <path d="M0 0 L420 0" stroke="#332A63" stroke-width="1.2"/>
      <circle cx="6" cy="0" r="2.4" fill="#2FF2A0" filter="url(#bloom)"/>
      <path d="M14 0 L120 0" stroke="#2EE6FF" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="136" cy="0" r="2.4" fill="#A78BFF"/>
      <path d="M144 0 L280 0" stroke="#FF6BD6" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="296" cy="0" r="2.4" fill="#FFD166" filter="url(#bloom)"/>
      <path d="M304 0 L420 0" stroke="#332A63" stroke-width="1.2"/>
    </g>
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="600" letter-spacing="4" fill="#8D82BF">LEARN</text>
      <circle cx="46" cy="-3" r="1.6" fill="#2FF2A0"/>
      <text x="56" y="0" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="600" letter-spacing="4" fill="#8D82BF">BUILD</text>
      <circle cx="108" cy="-3" r="1.6" fill="#2EE6FF"/>
      <text x="118" y="0" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="600" letter-spacing="4" fill="#8D82BF">WORK</text>
      <circle cx="168" cy="-3" r="1.6" fill="#A78BFF"/>
      <text x="178" y="0" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="600" letter-spacing="4" fill="#8D82BF">GROW</text>
      <circle cx="228" cy="-3" r="1.6" fill="#FF6BD6"/>
      <text x="238" y="0" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="800" letter-spacing="4" fill="#FFD166">GO GLOBAL</text>
    </g>
  </g>
</svg>