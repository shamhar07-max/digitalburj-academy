<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" width="680" height="150" fill="none">
  <defs>
    <linearGradient id="cyber-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E0FF"/>
      <stop offset="55%" stop-color="#8A4CFF"/>
      <stop offset="100%" stop-color="#FF2ED4"/>
    </linearGradient>
    <linearGradient id="cyber-spire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E0FF"/>
      <stop offset="100%" stop-color="#0A5F75"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g opacity="0.35">
    <line x1="30" y1="120" x2="650" y2="120" stroke="#00E0FF" stroke-width="0.8" stroke-dasharray="4 7"/>
    <line x1="112" y1="12" x2="112" y2="135" stroke="#FF2ED4" stroke-width="0.8" stroke-dasharray="2 6" opacity="0.5"/>
    <circle cx="112" cy="18" r="2" fill="#FF2ED4" filter="url(#bloom)"/>
  </g>

  <g transform="translate(30, 22)">
    <!-- spire chassis -->
    <path d="M18 96 L26 14 C26 11 29 9 34 9 C39 9 42 11 42 14 L50 96 Z" fill="url(#cyber-spire)" stroke="#00E0FF" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
    <line x1="34" y1="12" x2="34" y2="96" stroke="#EAF6FF" stroke-width="1.6" filter="url(#bloom)"/>
    <circle cx="34" cy="14" r="3.2" fill="#19FF8C" filter="url(#bloom)"/>
    <circle cx="34" cy="14" r="6.5" stroke="#19FF8C" stroke-width="1" stroke-dasharray="2 3" opacity="0.9"/>
    <circle cx="34" cy="14" r="11" stroke="#00E0FF" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.6"/>
    <!-- floor slab -->
    <rect x="10" y="94" width="48" height="4.5" rx="2" fill="#0B1024" stroke="#00E0FF" stroke-width="1" opacity="0.9"/>
    <path d="M14 86 L22 82 L22 94 L14 94 Z" fill="#1D2544"/>
    <line x1="18" y1="83" x2="18" y2="94" stroke="#19FF8C" stroke-width="1" opacity="0.8"/>
    <path d="M24 68 L31 64 L31 94 L24 94 Z" fill="#1D2544"/>
    <line x1="27.5" y1="66" x2="27.5" y2="94" stroke="#00E0FF" stroke-width="1.2" opacity="0.9"/>
    <!-- signal fan -->
    <line x1="34" y1="24" x2="70" y2="40" stroke="#19FF8C" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.8"/>
    <circle cx="70" cy="40" r="2.4" fill="#19FF8C" filter="url(#bloom)"/>
    <line x1="34" y1="40" x2="-2" y2="56" stroke="#FF2ED4" stroke-width="1.3" stroke-dasharray="3 4" opacity="0.8"/>
    <circle cx="-2" cy="56" r="2.2" fill="#FF2ED4" filter="url(#bloom)"/>
    <line x1="34" y1="58" x2="78" y2="72" stroke="#00E0FF" stroke-width="1.1" stroke-dasharray="2 3" opacity="0.7"/>
    <circle cx="78" cy="72" r="2" fill="#00E0FF"/>
    <!-- base path -->
    <path d="M-8 81 C16 66 76 62 90 80 C96 88 88 82 82 82 C66 78 30 80 8 88 C-2 92 -10 88 -8 81 Z" fill="#0A0E1C" stroke="url(#cyber-neon)" stroke-width="1.4" opacity="0.9"/>
  </g>

  <g transform="translate(122, 46)">
    <text x="0" y="0" font-family="'Orbitron','Rajdhani',ui-sans-serif,sans-serif" font-weight="900" font-size="34" letter-spacing="7" fill="#00E0FF" filter="url(#bloom)">DIGITAL</text>
    <text x="180" y="0" font-family="'Orbitron','Rajdhani',ui-sans-serif,sans-serif" font-weight="900" font-size="34" letter-spacing="7" fill="#EAF6FF">BURJ</text>
    <text x="370" y="0" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600" letter-spacing="3" fill="#FF2ED4">[000.1]</text>
    <g transform="translate(0, 16)">
      <path d="M0 0 L410 0" stroke="#1D2544" stroke-width="1.2"/>
      <path d="M0 0 L46 0" stroke="#FF2ED4" stroke-width="2.4" stroke-linecap="round" filter="url(#bloom)"/>
      <circle cx="54" cy="0" r="2.4" fill="#8A4CFF"/>
      <path d="M60 0 L150 0" stroke="#00E0FF" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="340" cy="0" r="1.8" fill="#19FF8C"/>
    </g>
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="600" letter-spacing="4" fill="#6B7799">LEARN</text>
      <circle cx="46" cy="-3" r="1.6" fill="#FF2ED4"/>
      <text x="56" y="0" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="600" letter-spacing="4" fill="#6B7799">BUILD</text>
      <circle cx="108" cy="-3" r="1.6" fill="#00E0FF"/>
      <text x="118" y="0" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="600" letter-spacing="4" fill="#6B7799">WORK</text>
      <circle cx="168" cy="-3" r="1.6" fill="#8A4CFF"/>
      <text x="178" y="0" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="600" letter-spacing="4" fill="#6B7799">GROW</text>
      <circle cx="228" cy="-3" r="1.6" fill="#19FF8C"/>
      <text x="238" y="0" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="800" letter-spacing="4" fill="#19FF8C">GO GLOBAL</text>
    </g>
  </g>
</svg>